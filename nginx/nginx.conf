events {
    worker_connections 1024;
}

http {
    # ── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── MCP Server (HTTPS) ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # MCP endpoint — SSE requires buffering off and long timeouts
        location /mcp {
            proxy_pass         http://triplex-mcp:5000;
            proxy_http_version 1.1;

            # SSE: disable buffering so events stream to Anthropic immediately
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # Long timeouts: Anthropic may hold the SSE connection for minutes
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            proxy_connect_timeout 10s;
        }

        # Health / info root
        location / {
            proxy_pass         http://triplex-mcp:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── Solve API (HTTPS, port 8443) ─────────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://solve-api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # Allow long-running /solve requests (Claude can take several minutes)
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
        }
    }
}
